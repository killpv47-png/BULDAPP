name: Cloudflare Web Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install ttyd and cloudflared
        run: |
          sudo apt update
          sudo apt install -y wget

          wget -O ttyd.tar.gz https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          tar -xzf ttyd.tar.gz
          sudo mv ttyd /usr/local/bin/

          wget -O cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Web Terminal
        run: |
          ttyd -p 7681 bash &

          sleep 5

          cloudflared tunnel --url http://localhost:7681 > cloudflare.log 2>&1 &

          sleep 10

          cat cloudflare.log | grep trycloudflare

          while true; do
            sleep 60
          done
