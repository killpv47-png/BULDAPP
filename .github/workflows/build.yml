# =============================================================================
# .github/workflows/server.yml
# Minecraft Java Edition 1.21.1 — Automated GitHub Actions Server
# Repository: kill_pv2
# Runner: ubuntu-latest (4 vCPU, 16 GB RAM on public repos / 8 GB on private)
# Max job runtime: 6 hours (GitHub Actions hard limit)
# =============================================================================
#
# ┌─────────────────────── HOW PUBLIC ACCESS WORKS ───────────────────────────┐
# │  1. The runner's raw public IP is printed (usable on LAN or via firewall) │
# │  2. playit.gg agent creates a permanent-looking TCP tunnel → port 25565   │
# │     (Requires PLAYIT_SECRET repo secret — see SETUP section below)        │
# │  3. If playit.gg is unavailable/unconfigured, cloudflared is used.        │
# │     NOTE: Cloudflare Quick Tunnels are HTTP only. For TCP (Minecraft),    │
# │     cloudflared needs a named tunnel with TCP configured. The workflow     │
# │     will still print instructions for clients using cloudflared locally.  │
# └───────────────────────────────────────────────────────────────────────────┘
#
# ══════════════════════════════════ SETUP ════════════════════════════════════
#
# REQUIRED (for public TCP access via playit.gg — recommended):
#   → Go to https://playit.gg and create a FREE account.
#   → Download the playit agent and run it once locally to generate a
#     secret key / claim URL. Copy the secret from ~/.config/playit/playit.toml
#     (the "secret_key" field) OR run: playit --secret_key and note the output.
#   → In your repo: Settings → Secrets and variables → Actions → New secret
#     Name: PLAYIT_SECRET   Value: <your playit secret key>
#   → In the playit dashboard, create a Minecraft (TCP) tunnel on port 25565.
#     The tunnel address will be printed in the workflow logs automatically.
#
# OPTIONAL (Cloudflare named tunnel — for cloudflared TCP, advanced):
#   → Requires a Cloudflare account + domain. See:
#     https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/
#   → Secrets: CF_TUNNEL_TOKEN (from `cloudflared tunnel create` command)
#
# NO SECRETS NEEDED → Server still runs; only the raw IP is shown in logs.
#
# =============================================================================

name: "🎮 Minecraft 1.21.1 Server"

on:
  # ── Trigger manually from the Actions tab ──────────────────────────────────
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "How many minutes to keep the server alive (max 350)"
        required: false
        default: "350"
        type: string
      server_message:
        description: "MOTD shown in server list (max 59 chars)"
        required: false
        default: "GitHub Actions Minecraft 1.21.1"
        type: string
      max_players:
        description: "Maximum number of players allowed"
        required: false
        default: "20"
        type: string

  # ── Also allow triggering on pushes to main (optional — remove if noisy) ──
  # push:
  #   branches: ["main"]

# One concurrent run at a time per branch
concurrency:
  group: minecraft-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minecraft-server:
    name: "🟢 Minecraft Java 1.21.1"
    runs-on: ubuntu-latest

    # GitHub Actions hard limit is 360 min; we set 355 to allow graceful shutdown
    timeout-minutes: 355

    # ── Environment variables available to every step ────────────────────────
    env:
      # ── Minecraft settings ─────────────────────────────────────────────────
      MC_VERSION: "1.21.1"
      MC_PORT: "25565"
      SERVER_DIR: "${{ github.workspace }}/minecraft"

      # ── Official Mojang server JAR for 1.21.1 (SHA1-verified) ─────────────
      # Source: https://piston-meta.mojang.com/v1/packages/057f7d2fa.../1.21.1.json
      JAR_URL: "https://piston-data.mojang.com/v1/objects/59353fb40c36d304f2035d51e7d6e6baa98dc05c/server.jar"
      JAR_SHA1: "59353fb40c36d304f2035d51e7d6e6baa98dc05c"
      JAR_NAME: "minecraft_server.1.21.1.jar"

      # ── Mojang manifest API (used to auto-resolve download URL) ─────────────
      MANIFEST_URL: "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"

      # ── JVM memory (public runner = 16 GB RAM; we use 10 GB for JVM heap) ──
      # Adjust to 6G if running on a private repository (8 GB RAM runner).
      JVM_XMS: "2G"
      JVM_XMX: "10G"

      # ── ANSI color codes for pretty log output ─────────────────────────────
      RED: "\033[0;31m"
      GREEN: "\033[0;32m"
      YELLOW: "\033[1;33m"
      CYAN: "\033[0;36m"
      BOLD: "\033[1m"
      RESET: "\033[0m"

    steps:

      # ════════════════════════════════════════════════════════════════════════
      # STEP 1 — SYSTEM BANNER
      # ════════════════════════════════════════════════════════════════════════
      - name: "📋 System Banner & Pre-flight Info"
        run: |
          echo ""
          echo -e "${BOLD}${CYAN}╔══════════════════════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${CYAN}║   🎮  Minecraft Java Edition 1.21.1 — Server Boot   ║${RESET}"
          echo -e "${BOLD}${CYAN}╚══════════════════════════════════════════════════════╝${RESET}"
          echo ""
          echo -e "${YELLOW}Runner OS     :${RESET} $(lsb_release -ds)"
          echo -e "${YELLOW}Kernel        :${RESET} $(uname -r)"
          echo -e "${YELLOW}CPU Cores     :${RESET} $(nproc)"
          echo -e "${YELLOW}Total RAM     :${RESET} $(free -h | awk '/^Mem:/{print $2}')"
          echo -e "${YELLOW}Free Disk     :${RESET} $(df -h / | awk 'NR==2{print $4}')"
          echo -e "${YELLOW}Workflow Run  :${RESET} ${{ github.run_id }}"
          echo -e "${YELLOW}Triggered by  :${RESET} ${{ github.actor }}"
          echo -e "${YELLOW}Repository    :${RESET} ${{ github.repository }}"
          echo -e "${YELLOW}Server Dir    :${RESET} ${SERVER_DIR}"
          echo ""
          echo -e "${GREEN}✔ Pre-flight check complete.${RESET}"

      # ════════════════════════════════════════════════════════════════════════
      # STEP 2 — JAVA 21 INSTALLATION
      # ════════════════════════════════════════════════════════════════════════
      - name: "☕ Install / Verify Java 21 (Temurin)"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}☕ Checking Java version…${RESET}"

          # Check if Java 21+ is already present
          if java -version 2>&1 | grep -q 'version "21'; then
            echo -e "${GREEN}✔ Java 21 already installed:${RESET}"
            java -version
          else
            echo -e "${YELLOW}⚠ Java 21 not found — installing Eclipse Temurin 21…${RESET}"

            # Add Eclipse Temurin APT repository
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget apt-transport-https gnupg

            wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public \
              | sudo gpg --dearmor -o /usr/share/keyrings/adoptium.gpg

            echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] \
              https://packages.adoptium.net/artifactory/deb \
              $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/adoptium.list > /dev/null

            sudo apt-get update -qq
            sudo apt-get install -y -qq temurin-21-jdk

            echo -e "${GREEN}✔ Java 21 installed successfully.${RESET}"
            java -version
          fi

          # Export JAVA_HOME for subsequent steps
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      # ════════════════════════════════════════════════════════════════════════
      # STEP 3 — INSTALL UTILITIES (jq, curl, etc.)
      # ════════════════════════════════════════════════════════════════════════
      - name: "🔧 Install Required Utilities"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}🔧 Installing utilities (jq, curl, screen, net-tools)…${RESET}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            jq \
            curl \
            wget \
            screen \
            net-tools \
            lsof \
            netcat-openbsd
          echo -e "${GREEN}✔ Utilities installed.${RESET}"

      # ════════════════════════════════════════════════════════════════════════
      # STEP 4 — PUBLIC IP DISCOVERY
      # ════════════════════════════════════════════════════════════════════════
      - name: "🌐 Discover Runner Public IP"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}🌐 Detecting runner public IP address…${RESET}"

          # Try multiple IP discovery services with fallback
          PUBLIC_IP=""
          for SERVICE in \
            "https://api.ipify.org" \
            "https://ipv4.icanhazip.com" \
            "https://api4.my-ip.io/ip" \
            "https://checkip.amazonaws.com"; do
            PUBLIC_IP=$(curl -sf --max-time 5 "$SERVICE" | tr -d '[:space:]') && break
          done

          if [[ -z "$PUBLIC_IP" ]]; then
            PUBLIC_IP="UNKNOWN (IP detection failed)"
          fi

          echo "PUBLIC_IP=${PUBLIC_IP}" >> $GITHUB_ENV

          echo ""
          echo -e "${BOLD}${GREEN}╔══════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${GREEN}║  🌐 Runner Public IPv4: ${PUBLIC_IP}${RESET}"
          echo -e "${BOLD}${GREEN}╚══════════════════════════════════════╝${RESET}"
          echo ""
          echo -e "${YELLOW}⚠ Note: GitHub Actions runners are behind Azure NAT.${RESET}"
          echo -e "${YELLOW}  Direct connection on port ${MC_PORT} will likely be blocked.${RESET}"
          echo -e "${YELLOW}  Use the tunnel address printed in a later step instead.${RESET}"

      # ════════════════════════════════════════════════════════════════════════
      # STEP 5 — DOWNLOAD SERVER JAR (with verification + API fallback)
      # ════════════════════════════════════════════════════════════════════════
      - name: "📦 Download Minecraft Server JAR 1.21.1"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}📦 Preparing Minecraft server directory…${RESET}"

          mkdir -p "${SERVER_DIR}"
          cd "${SERVER_DIR}"

          JAR_PATH="${SERVER_DIR}/${JAR_NAME}"

          # ── Helper: verify SHA1 checksum ───────────────────────────────────
          verify_sha1() {
            local file="$1"
            local expected="$2"
            local actual
            actual=$(sha1sum "$file" | awk '{print $1}')
            if [[ "$actual" == "$expected" ]]; then
              echo -e "${GREEN}  ✔ SHA1 verified: ${actual}${RESET}"
              return 0
            else
              echo -e "${RED}  ✘ SHA1 mismatch! Expected: ${expected}, Got: ${actual}${RESET}"
              return 1
            fi
          }

          # ── Check if JAR already exists and is valid ───────────────────────
          if [[ -f "$JAR_PATH" ]]; then
            echo -e "${YELLOW}  Found existing JAR — verifying integrity…${RESET}"
            if verify_sha1 "$JAR_PATH" "$JAR_SHA1"; then
              echo -e "${GREEN}✔ Existing JAR is valid. Skipping download.${RESET}"
              exit 0
            else
              echo -e "${YELLOW}  Existing JAR is corrupt. Re-downloading…${RESET}"
              rm -f "$JAR_PATH"
            fi
          fi

          # ── Strategy 1: Resolve download URL dynamically from Mojang API ───
          echo -e "${BOLD}  Strategy 1: Resolving URL via Mojang version manifest API…${RESET}"
          API_DOWNLOAD_URL=""

          VERSION_META_URL=$(curl -sf --max-time 10 "${MANIFEST_URL}" \
            | jq -r '.versions[] | select(.id == "'${MC_VERSION}'") | .url' 2>/dev/null || true)

          if [[ -n "$VERSION_META_URL" ]]; then
            echo -e "  → Fetching version meta from: ${VERSION_META_URL}"
            API_DOWNLOAD_URL=$(curl -sf --max-time 10 "$VERSION_META_URL" \
              | jq -r '.downloads.server.url' 2>/dev/null || true)
          fi

          if [[ -n "$API_DOWNLOAD_URL" ]]; then
            echo -e "  → Downloading from API-resolved URL: ${API_DOWNLOAD_URL}"
            for ATTEMPT in 1 2 3; do
              echo -e "  → Attempt ${ATTEMPT}/3…"
              if curl -L --progress-bar --max-time 120 --retry 2 \
                   -o "$JAR_PATH" "$API_DOWNLOAD_URL"; then
                if verify_sha1 "$JAR_PATH" "$JAR_SHA1"; then
                  echo -e "${GREEN}✔ JAR downloaded and verified via API! (${ATTEMPT}/3)${RESET}"
                  exit 0
                fi
              fi
              rm -f "$JAR_PATH"
              sleep 3
            done
            echo -e "${YELLOW}  ⚠ API download failed — falling back to hardcoded URL.${RESET}"
          else
            echo -e "${YELLOW}  ⚠ Could not resolve URL from API — using hardcoded fallback.${RESET}"
          fi

          # ── Strategy 2: Hardcoded SHA1-pinned official Mojang URL ──────────
          echo -e "${BOLD}  Strategy 2: Downloading from hardcoded verified URL…${RESET}"
          echo -e "  → URL: ${JAR_URL}"
          for ATTEMPT in 1 2 3; do
            echo -e "  → Attempt ${ATTEMPT}/3…"
            if curl -L --progress-bar --max-time 120 --retry 2 \
                 -o "$JAR_PATH" "$JAR_URL"; then
              if verify_sha1 "$JAR_PATH" "$JAR_SHA1"; then
                echo -e "${GREEN}✔ JAR downloaded and verified via fallback URL!${RESET}"
                exit 0
              fi
            fi
            rm -f "$JAR_PATH"
            echo -e "${YELLOW}  Attempt ${ATTEMPT} failed. Retrying in 5s…${RESET}"
            sleep 5
          done

          # ── Both strategies failed ─────────────────────────────────────────
          echo -e "${RED}✘ FATAL: Failed to download server JAR after all retries!${RESET}"
          exit 1

      # ════════════════════════════════════════════════════════════════════════
      # STEP 6 — SERVER CONFIGURATION
      # ════════════════════════════════════════════════════════════════════════
      - name: "⚙️ Configure Server (EULA, properties, JVM flags)"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}⚙️ Writing server configuration files…${RESET}"

          cd "${SERVER_DIR}"

          # ── Accept EULA automatically ──────────────────────────────────────
          # By writing this file we agree to Minecraft's EULA on behalf of the
          # server operator. See: https://aka.ms/MinecraftEULA
          cat > eula.txt << 'EOF'
          # Minecraft EULA - accepted automatically by this workflow
          # See https://aka.ms/MinecraftEULA
          eula=true
          EOF
          echo -e "${GREEN}  ✔ EULA accepted (eula.txt written).${RESET}"

          # ── server.properties ─────────────────────────────────────────────
          MOTD="${{ github.event.inputs.server_message || 'GitHub Actions Minecraft 1.21.1' }}"
          MAX_PLAYERS="${{ github.event.inputs.max_players || '20' }}"

          cat > server.properties << EOF
          # ── Server Identity ─────────────────────────────────────────────
          server-port=${MC_PORT}
          motd=${MOTD} ✦ github.com/${GITHUB_REPOSITORY}
          server-ip=

          # ── Player Settings ─────────────────────────────────────────────
          max-players=${MAX_PLAYERS}
          online-mode=false
          white-list=false
          enforce-whitelist=false
          pvp=true
          gamemode=survival
          difficulty=normal
          hardcore=false
          allow-flight=false

          # ── World Settings ──────────────────────────────────────────────
          level-name=world
          level-type=minecraft\:normal
          generate-structures=true
          spawn-npcs=true
          spawn-animals=true
          spawn-monsters=true

          # ── Performance Tuning ───────────────────────────────────────────
          # Optimize for GitHub Actions runner (no persistent players expected)
          view-distance=8
          simulation-distance=6
          max-tick-time=60000
          max-world-size=5000
          network-compression-threshold=256
          rate-limit=0

          # ── Network ─────────────────────────────────────────────────────
          enable-rcon=false
          enable-query=false
          query.port=25565
          rcon.port=25575

          # ── Logging ─────────────────────────────────────────────────────
          log-ips=true
          EOF

          echo -e "${GREEN}  ✔ server.properties written.${RESET}"

          # ── ops.json — grant operator to repo owner ────────────────────────
          # (Players must have the same username to use commands)
          cat > ops.json << 'EOF'
          []
          EOF

          # ── JVM launch flags (Aikar's G1GC flags for Minecraft) ───────────
          # These are the industry-standard flags recommended by PaperMC.
          # Source: https://aikar.co/mcflags.html
          # Adapted for vanilla 1.21.1 on a 10 GB heap.
          cat > start.sh << EOF
          #!/usr/bin/env bash
          # Minecraft 1.21.1 startup script — Aikar's JVM flags
          set -euo pipefail

          JAVA_BIN="\$(which java)"
          JAR="${SERVER_DIR}/${JAR_NAME}"

          exec "\$JAVA_BIN" \\
            -Xms${JVM_XMS} \\
            -Xmx${JVM_XMX} \\
            -XX:+UseG1GC \\
            -XX:+ParallelRefProcEnabled \\
            -XX:MaxGCPauseMillis=200 \\
            -XX:+UnlockExperimentalVMOptions \\
            -XX:+DisableExplicitGC \\
            -XX:+AlwaysPreTouch \\
            -XX:G1NewSizePercent=30 \\
            -XX:G1MaxNewSizePercent=40 \\
            -XX:G1HeapRegionSize=8M \\
            -XX:G1ReservePercent=20 \\
            -XX:G1HeapWastePercent=5 \\
            -XX:G1MixedGCCountTarget=4 \\
            -XX:InitiatingHeapOccupancyPercent=15 \\
            -XX:G1MixedGCLiveThresholdPercent=90 \\
            -XX:G1RSetUpdatingPauseTimePercent=5 \\
            -XX:SurvivorRatio=32 \\
            -XX:+PerfDisableSharedMem \\
            -XX:MaxTenuringThreshold=1 \\
            -XX:+UseStringDeduplication \\
            -Dusing.aikars.flags=https://mcflags.emc.gs \\
            -Daikars.new.flags=true \\
            -Djava.net.preferIPv4Stack=true \\
            -jar "\$JAR" \\
            --nogui \\
            nogui
          EOF
          chmod +x start.sh

          echo -e "${GREEN}  ✔ start.sh written with Aikar's G1GC flags (${JVM_XMX} heap).${RESET}"
          echo ""
          echo -e "${BOLD}Server configuration summary:${RESET}"
          echo -e "  Port      : ${MC_PORT}"
          echo -e "  MOTD      : ${MOTD}"
          echo -e "  Max Players: ${MAX_PLAYERS}"
          echo -e "  Online Mode: false (no Mojang auth — any username can join)"
          echo -e "  JVM Heap  : ${JVM_XMS} – ${JVM_XMX}"

      # ════════════════════════════════════════════════════════════════════════
      # STEP 7 — LAUNCH MINECRAFT SERVER (background via screen)
      # ════════════════════════════════════════════════════════════════════════
      - name: "🚀 Launch Minecraft Server"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}🚀 Starting Minecraft server in background…${RESET}"

          cd "${SERVER_DIR}"

          # Start server in a detached screen session
          screen -dmS minecraft bash -c "
            cd '${SERVER_DIR}'
            echo '[wrapper] Starting server...'
            bash start.sh 2>&1 | tee server.log
            echo '[wrapper] Server process ended.'
          "

          echo -e "${GREEN}  ✔ Screen session 'minecraft' launched.${RESET}"

          # ── Wait for server to finish initialisation ───────────────────────
          echo -e "${BOLD}  ⏳ Waiting for server to reach 'Done' state (up to 3 min)…${RESET}"
          TIMEOUT=180
          ELAPSED=0
          READY=false

          while [[ $ELAPSED -lt $TIMEOUT ]]; do
            sleep 3
            ELAPSED=$((ELAPSED + 3))

            if [[ -f "${SERVER_DIR}/server.log" ]]; then
              # The vanilla server prints "Done (X.XXXs)! For help, type "help""
              if grep -q 'Done (' "${SERVER_DIR}/server.log" 2>/dev/null; then
                READY=true
                break
              fi

              # Detect fatal errors early
              if grep -qE '(FATAL|ERROR.*Failed|exception in server tick loop)' \
                   "${SERVER_DIR}/server.log" 2>/dev/null; then
                echo -e "${RED}  ✘ Server reported a fatal error!${RESET}"
                echo -e "${RED}  Last 30 lines of server.log:${RESET}"
                tail -30 "${SERVER_DIR}/server.log"
                exit 1
              fi
            fi

            # Print a heartbeat dot every 15 seconds
            if (( ELAPSED % 15 == 0 )); then
              echo -e "${YELLOW}  … still starting (${ELAPSED}s elapsed)…${RESET}"
            fi
          done

          if [[ "$READY" == "false" ]]; then
            echo -e "${RED}  ✘ Server did not reach 'Done' state within ${TIMEOUT}s!${RESET}"
            echo -e "${RED}  Last 50 lines of server.log:${RESET}"
            [[ -f "${SERVER_DIR}/server.log" ]] && tail -50 "${SERVER_DIR}/server.log"
            exit 1
          fi

          # ── Extract actual startup time from log ───────────────────────────
          DONE_LINE=$(grep 'Done (' "${SERVER_DIR}/server.log" | tail -1)
          echo ""
          echo -e "${BOLD}${GREEN}╔══════════════════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${GREEN}║  ✅  SERVER IS ONLINE AND ACCEPTING CONNECTIONS  ║${RESET}"
          echo -e "${BOLD}${GREEN}║  ${DONE_LINE}${RESET}"
          echo -e "${BOLD}${GREEN}╚══════════════════════════════════════════════════╝${RESET}"
          echo ""

      # ════════════════════════════════════════════════════════════════════════
      # STEP 8 — PUBLIC TUNNEL SETUP (playit.gg — preferred, TCP native)
      # ════════════════════════════════════════════════════════════════════════
      - name: "🔗 Setup playit.gg TCP Tunnel"
        # Only runs if the PLAYIT_SECRET repository secret is configured
        if: ${{ env.PLAYIT_SECRET != '' }}
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}🔗 Setting up playit.gg TCP tunnel…${RESET}"

          # ── Download latest playit-linux-amd64 binary ─────────────────────
          PLAYIT_API="https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          echo -e "  → Downloading playit agent binary…"

          for ATTEMPT in 1 2 3; do
            if wget -qO /usr/local/bin/playit "$PLAYIT_API"; then
              chmod +x /usr/local/bin/playit
              echo -e "${GREEN}  ✔ playit agent downloaded.${RESET}"
              break
            fi
            echo -e "${YELLOW}  Attempt ${ATTEMPT} failed. Retrying…${RESET}"
            sleep 5
          done

          if [[ ! -x /usr/local/bin/playit ]]; then
            echo -e "${RED}  ✘ Could not download playit. Skipping this step.${RESET}"
            exit 0
          fi

          # ── Write playit secret key to config file ─────────────────────────
          mkdir -p ~/.config/playit
          cat > ~/.config/playit/playit.toml << EOF
          secret_key = "${PLAYIT_SECRET}"
          EOF

          echo -e "  → Starting playit agent in background…"
          # Run playit in background, tee output to a log file
          playit --secret_key "${PLAYIT_SECRET}" \
            > /tmp/playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "PLAYIT_PID=${PLAYIT_PID}" >> $GITHUB_ENV

          echo -e "  → Waiting for playit to establish tunnel (up to 30s)…"
          TUNNEL_ADDR=""
          for i in $(seq 1 30); do
            sleep 1
            # playit prints the assigned address in its log
            TUNNEL_ADDR=$(grep -oP '(?<=Tunnel address: )[\w.\-:]+' /tmp/playit.log 2>/dev/null \
                         || grep -oP '\b[\w]+\.ply\.gg:\d+\b' /tmp/playit.log 2>/dev/null \
                         || grep -oP '\b[\w]+\.joinmc\.link:\d+\b' /tmp/playit.log 2>/dev/null \
                         || true)
            [[ -n "$TUNNEL_ADDR" ]] && break
          done

          echo ""
          if [[ -n "$TUNNEL_ADDR" ]]; then
            echo -e "${BOLD}${GREEN}╔══════════════════════════════════════════════════════╗${RESET}"
            echo -e "${BOLD}${GREEN}║  🎮  CONNECT VIA PLAYIT.GG TUNNEL                   ║${RESET}"
            echo -e "${BOLD}${GREEN}║  Server Address: ${TUNNEL_ADDR}${RESET}"
            echo -e "${BOLD}${GREEN}║  Add this to Minecraft → Multiplayer → Add Server    ║${RESET}"
            echo -e "${BOLD}${GREEN}╚══════════════════════════════════════════════════════╝${RESET}"
            echo "TUNNEL_ADDRESS=${TUNNEL_ADDR}" >> $GITHUB_ENV
          else
            echo -e "${YELLOW}  ⚠ Could not parse tunnel address from playit logs.${RESET}"
            echo -e "${YELLOW}  playit.log contents:${RESET}"
            cat /tmp/playit.log || true
            echo -e "${YELLOW}  → Check your playit.gg dashboard for the tunnel address.${RESET}"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # STEP 9 — FALLBACK TUNNEL (cloudflared — for HTTP inspection / info)
      # ════════════════════════════════════════════════════════════════════════
      - name: "🌩️ Setup Cloudflare Tunnel (Fallback)"
        # Only run if playit is not configured OR as a complement
        if: ${{ env.PLAYIT_SECRET == '' }}
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}🌩️ Setting up Cloudflare tunnel (fallback)…${RESET}"

          # ── Download cloudflared ───────────────────────────────────────────
          echo -e "  → Downloading cloudflared binary…"
          for ATTEMPT in 1 2 3; do
            if wget -qO /usr/local/bin/cloudflared \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"; then
              chmod +x /usr/local/bin/cloudflared
              echo -e "${GREEN}  ✔ cloudflared downloaded: $(cloudflared --version)${RESET}"
              break
            fi
            sleep 5
          done

          if [[ ! -x /usr/local/bin/cloudflared ]]; then
            echo -e "${RED}  ✘ Could not install cloudflared. Skipping.${RESET}"
            exit 0
          fi

          # ── Named tunnel (requires CF_TUNNEL_TOKEN secret) ─────────────────
          if [[ -n "${CF_TUNNEL_TOKEN:-}" ]]; then
            echo -e "  → Starting named Cloudflare tunnel with CF_TUNNEL_TOKEN…"
            echo -e "${YELLOW}  ⚠ Named tunnel requires TCP ingress configured in Cloudflare dashboard.${RESET}"
            cloudflared tunnel --no-autoupdate run --token "${CF_TUNNEL_TOKEN}" \
              > /tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            echo "CF_PID=${CF_PID}" >> $GITHUB_ENV
            sleep 5
            echo -e "${GREEN}  ✔ Named Cloudflare tunnel started (PID: ${CF_PID}).${RESET}"
            echo -e "${YELLOW}  → Connect clients via cloudflared:${RESET}"
            echo -e "    cloudflared access tcp --hostname <your-domain> --url localhost:${MC_PORT}"

          else
            # ── Quick tunnel (HTTP only — prints instructions for TCP workaround)
            echo -e "${YELLOW}  ⚠ No CF_TUNNEL_TOKEN found. Using Quick Tunnel (HTTP only).${RESET}"
            echo -e "${YELLOW}  NOTE: Cloudflare Quick Tunnels do NOT support raw TCP.${RESET}"
            echo -e "${YELLOW}        For Minecraft (TCP), each player must run cloudflared locally.${RESET}"

            # Start a quick tunnel to an HTTP health-check endpoint instead
            # This proves connectivity; TCP is handled client-side
            cloudflared tunnel --no-autoupdate --url "tcp://localhost:${MC_PORT}" \
              > /tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            echo "CF_PID=${CF_PID}" >> $GITHUB_ENV

            sleep 8

            # Extract the tunnel URL from cloudflared output
            CF_URL=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' /tmp/cloudflared.log \
                     | head -1 || true)

            echo ""
            echo -e "${BOLD}${CYAN}╔══════════════════════════════════════════════════════════╗${RESET}"
            echo -e "${BOLD}${CYAN}║  🌩️  CLOUDFLARE TUNNEL INFO                              ║${RESET}"
            echo -e "${BOLD}${CYAN}║                                                           ║${RESET}"
            if [[ -n "$CF_URL" ]]; then
              echo -e "${BOLD}${CYAN}║  Tunnel URL: ${CF_URL}${RESET}"
              echo "CF_TUNNEL_URL=${CF_URL}" >> $GITHUB_ENV
            else
              echo -e "${BOLD}${CYAN}║  Tunnel URL: (parsing failed — check /tmp/cloudflared.log)${RESET}"
            fi
            echo -e "${BOLD}${CYAN}║                                                           ║${RESET}"
            echo -e "${BOLD}${CYAN}║  ⚠ To connect via Minecraft, EACH PLAYER must run:       ║${RESET}"
            echo -e "${BOLD}${CYAN}║    cloudflared access tcp \\                               ║${RESET}"
            echo -e "${BOLD}${CYAN}║      --hostname <tunnel-url-above> \\                      ║${RESET}"
            echo -e "${BOLD}${CYAN}║      --url localhost:25565                                ║${RESET}"
            echo -e "${BOLD}${CYAN}║  Then connect Minecraft to: localhost:25565               ║${RESET}"
            echo -e "${BOLD}${CYAN}║                                                           ║${RESET}"
            echo -e "${BOLD}${CYAN}║  👉 Recommended: Add PLAYIT_SECRET secret instead!       ║${RESET}"
            echo -e "${BOLD}${CYAN}╚══════════════════════════════════════════════════════════╝${RESET}"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # STEP 10 — CONNECTION SUMMARY
      # ════════════════════════════════════════════════════════════════════════
      - name: "📌 Connection Summary"
        run: |
          echo ""
          echo -e "${BOLD}${CYAN}╔═══════════════════════════════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${CYAN}║            🎮  MINECRAFT SERVER CONNECTION INFO               ║${RESET}"
          echo -e "${BOLD}${CYAN}╠═══════════════════════════════════════════════════════════════╣${RESET}"
          echo -e "${BOLD}${CYAN}║  Version       : Minecraft Java Edition 1.21.1                ║${RESET}"
          echo -e "${BOLD}${CYAN}║  Runner IP     : ${PUBLIC_IP}                   ║${RESET}"
          echo -e "${BOLD}${CYAN}║  Port          : ${MC_PORT}                                   ║${RESET}"
          if [[ -n "${TUNNEL_ADDRESS:-}" ]]; then
          echo -e "${BOLD}${GREEN}║  🔗 playit.gg  : ${TUNNEL_ADDRESS}             ║${RESET}"
          fi
          if [[ -n "${CF_TUNNEL_URL:-}" ]]; then
          echo -e "${BOLD}${CYAN}║  🌩️ Cloudflare : ${CF_TUNNEL_URL}              ║${RESET}"
          fi
          echo -e "${BOLD}${CYAN}║  Online Mode   : OFF (any username can join)                  ║${RESET}"
          echo -e "${BOLD}${CYAN}║  JVM Heap      : ${JVM_XMS} – ${JVM_XMX}                             ║${RESET}"
          echo -e "${BOLD}${CYAN}╠═══════════════════════════════════════════════════════════════╣${RESET}"
          echo -e "${BOLD}${CYAN}║  ℹ️  This server will remain online for the duration of the   ║${RESET}"
          echo -e "${BOLD}${CYAN}║     GitHub Actions job (max ~6 hours total).                  ║${RESET}"
          echo -e "${BOLD}${CYAN}╚═══════════════════════════════════════════════════════════════╝${RESET}"
          echo ""

      # ════════════════════════════════════════════════════════════════════════
      # STEP 11 — KEEP-ALIVE LOOP (live log streaming + health checks)
      # ════════════════════════════════════════════════════════════════════════
      - name: "⏱️ Keep Server Alive (Live Log Monitor)"
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}⏱️ Keep-alive loop started. Streaming server logs…${RESET}"
          echo -e "${YELLOW}  Job will run for up to ${{ github.event.inputs.keep_alive_minutes || '350' }} minutes.${RESET}"
          echo ""

          KEEP_ALIVE_MINUTES="${{ github.event.inputs.keep_alive_minutes || '350' }}"
          # Clamp to a safe maximum (GitHub limit is 360, we leave buffer)
          [[ "$KEEP_ALIVE_MINUTES" -gt 350 ]] && KEEP_ALIVE_MINUTES=350

          MAX_SECONDS=$((KEEP_ALIVE_MINUTES * 60))
          ELAPSED=0
          HEALTH_INTERVAL=30   # health check every 30 seconds
          LAST_LOG_LINE=0       # track last line read from server.log
          SERVER_LOG="${SERVER_DIR}/server.log"

          # ── Helper: check server process is still alive ────────────────────
          is_server_alive() {
            screen -list | grep -q "minecraft" && return 0
            # Also check by port
            lsof -i ":${MC_PORT}" -sTCP:LISTEN -t &>/dev/null && return 0
            return 1
          }

          # ── Helper: tail new log lines ─────────────────────────────────────
          stream_new_log_lines() {
            if [[ -f "$SERVER_LOG" ]]; then
              CURRENT_LINES=$(wc -l < "$SERVER_LOG")
              if [[ $CURRENT_LINES -gt $LAST_LOG_LINE ]]; then
                tail -n +$((LAST_LOG_LINE + 1)) "$SERVER_LOG" \
                  | head -n $((CURRENT_LINES - LAST_LOG_LINE))
                LAST_LOG_LINE=$CURRENT_LINES
              fi
            fi
          }

          # ── Main keep-alive loop ───────────────────────────────────────────
          while [[ $ELAPSED -lt $MAX_SECONDS ]]; do
            sleep $HEALTH_INTERVAL
            ELAPSED=$((ELAPSED + HEALTH_INTERVAL))

            REMAINING=$((MAX_SECONDS - ELAPSED))
            MINS_REMAINING=$((REMAINING / 60))

            # Stream any new server log lines
            stream_new_log_lines

            # Health check
            if ! is_server_alive; then
              echo ""
              echo -e "${RED}╔══════════════════════════════════════════════════╗${RESET}"
              echo -e "${RED}║  ✘ SERVER PROCESS DIED — Attempting restart...   ║${RESET}"
              echo -e "${RED}╚══════════════════════════════════════════════════╝${RESET}"

              # Attempt one automatic restart
              cd "${SERVER_DIR}"
              screen -dmS minecraft bash -c "
                cd '${SERVER_DIR}'
                bash start.sh 2>&1 | tee -a server.log
              "
              sleep 20

              if is_server_alive; then
                echo -e "${GREEN}  ✔ Server restarted successfully.${RESET}"
              else
                echo -e "${RED}  ✘ Restart failed. Terminating workflow.${RESET}"
                tail -50 "$SERVER_LOG" || true
                exit 1
              fi
            fi

            # Periodic status heartbeat (every 5 minutes)
            if (( (ELAPSED % 300) == 0 )); then
              PLAYER_COUNT=$(grep -c 'joined the game' "$SERVER_LOG" 2>/dev/null || echo "0")
              echo ""
              echo -e "${BOLD}${GREEN}[HEARTBEAT @ ${ELAPSED}s] Server healthy ✔ — ${MINS_REMAINING} min remaining${RESET}"
              echo -e "  Tunnel : ${TUNNEL_ADDRESS:-${CF_TUNNEL_URL:-${PUBLIC_IP}:${MC_PORT}}}"
              echo ""
            fi
          done

          echo ""
          echo -e "${BOLD}${YELLOW}╔══════════════════════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${YELLOW}║  ⏰  Keep-alive limit reached (${KEEP_ALIVE_MINUTES} min).            ║${RESET}"
          echo -e "${BOLD}${YELLOW}║     Server will be shut down with the job.           ║${RESET}"
          echo -e "${BOLD}${YELLOW}╚══════════════════════════════════════════════════════╝${RESET}"

      # ════════════════════════════════════════════════════════════════════════
      # STEP 12 — GRACEFUL SHUTDOWN
      # Always runs, even if previous steps failed
      # ════════════════════════════════════════════════════════════════════════
      - name: "🛑 Graceful Server Shutdown"
        if: always()
        run: |
          echo -e "${CYAN}──────────────────────────────────────────${RESET}"
          echo -e "${BOLD}🛑 Shutting down server gracefully…${RESET}"

          # Send 'stop' command to the Minecraft server via screen
          if screen -list | grep -q "minecraft"; then
            screen -S minecraft -p 0 -X stuff "stop$(printf '\r')"
            echo -e "  → 'stop' command sent to server."
            sleep 8
          fi

          # Kill screen session if still alive
          screen -S minecraft -X quit 2>/dev/null || true

          # Kill tunnel processes
          [[ -n "${PLAYIT_PID:-}" ]] && kill "${PLAYIT_PID}" 2>/dev/null || true
          [[ -n "${CF_PID:-}" ]]     && kill "${CF_PID}"     2>/dev/null || true

          echo ""
          echo -e "${BOLD}${CYAN}╔══════════════════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${CYAN}║  📊  FINAL SERVER STATISTICS                     ║${RESET}"
          echo -e "${BOLD}${CYAN}╠══════════════════════════════════════════════════╣${RESET}"

          if [[ -f "${SERVER_DIR}/server.log" ]]; then
            TOTAL_JOINS=$(grep -c 'joined the game' "${SERVER_DIR}/server.log" 2>/dev/null || echo "0")
            TOTAL_LINES=$(wc -l < "${SERVER_DIR}/server.log")
            echo -e "${CYAN}║  Total log lines    : ${TOTAL_LINES}                        ║${RESET}"
            echo -e "${CYAN}║  Total player joins : ${TOTAL_JOINS}                        ║${RESET}"
          fi

          echo -e "${BOLD}${CYAN}╚══════════════════════════════════════════════════╝${RESET}"
          echo -e "${GREEN}✔ Shutdown complete. Goodbye!${RESET}"
