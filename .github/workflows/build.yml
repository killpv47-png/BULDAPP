name: Cloudflare Web Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y wget curl

      - name: Install ttyd
        run: |
          wget -O ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin/ttyd

      - name: Install cloudflared
        run: |
          wget -O cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Web Terminal
        run: |
          echo "Starting ttyd..."

          ttyd \
          -p 7681 \
          -W \
          bash &

          sleep 5

          echo "Starting Cloudflare Tunnel..."

          cloudflared tunnel \
          --url http://localhost:7681 \
          > cloudflare.log 2>&1 &

          sleep 15

          echo "=============================="
          echo "YOUR WEB TERMINAL:"
          cat cloudflare.log | grep -o "https://[-a-zA-Z0-9]*\.trycloudflare\.com"
          echo "=============================="

          while true
          do
            sleep 60
          done
